---
- name: Remove only the Molecule-owned DAS fixture directory
  hosts: all
  gather_facts: false
  vars_files:
    - fixture-vars.yml
  tasks:
    - name: Validate the Molecule-owned cleanup root
      ansible.builtin.assert:
        that:
          - das_molecule_ephemeral_directory | length > 1
          - >-
            das_molecule_fixture_root is
            match('^/tmp/docker-ansible-summary-molecule-[0-9a-f]{64}$')
        fail_msg: Refusing cleanup without a Molecule scenario workspace

    - name: Remove the daemonless fixture directory
      ansible.builtin.file:
        path: "{{ das_molecule_fixture_root }}"
        state: absent
