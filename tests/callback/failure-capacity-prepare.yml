---
- name: Prepare a retained pre observation for presentation-capacity testing
  hosts: callback_failure_single
  gather_facts: false
  environment:
    DAS_CALLBACK_FAILURE_MODE: capacity
    PATH: >-
      {{ lookup('env', 'DAS_CALLBACK_FAILURE_BIN') }}:{{ lookup('env', 'PATH') }}
  tasks:
    - name: DAS callback failure contract | Commit the capacity pre observation
      ansible.builtin.import_role:
        name: docker_ansible_summary
        tasks_from: observe
        allow_duplicates: true
      vars:
        docker_ansible_summary_operation: pre
        docker_ansible_summary_instance_id: callback-capacity
        docker_ansible_summary_scope:
          - das-*
        docker_ansible_summary_record_id: callback-capacity-record
        docker_ansible_summary_state_root: >-
          {{ lookup('env', 'DAS_CALLBACK_FAILURE_ROOT') }}/capacity-state
        docker_ansible_summary_report_mode: none
        docker_ansible_summary_report_width: 100
