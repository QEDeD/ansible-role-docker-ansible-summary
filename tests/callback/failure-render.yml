---
- name: Exercise ordinary renderer failure after a real committed post
  hosts: callback_failure_single
  gather_facts: false
  environment:
    DAS_CALLBACK_FAILURE_INJECTION: render_failed
    DAS_CALLBACK_FAILURE_MODE: empty
    PATH: >-
      {{ lookup('env', 'DAS_CALLBACK_FAILURE_BIN') }}:{{ lookup('env', 'PATH') }}
  tasks:
    - name: DAS callback failure contract | Fail the renderer after commit
      ansible.builtin.import_role:
        name: docker_ansible_summary
        tasks_from: observe
        allow_duplicates: true
      vars:
        docker_ansible_summary_operation: post
        docker_ansible_summary_instance_id: callback-render
        docker_ansible_summary_scope:
          - das-*
        docker_ansible_summary_record_id: callback-render-record
        docker_ansible_summary_state_root: >-
          {{ lookup('env', 'DAS_CALLBACK_FAILURE_ROOT') }}/render-state
        docker_ansible_summary_report_mode: final
