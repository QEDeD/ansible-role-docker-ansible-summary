---
fixture_family: focused_cases
topic: execution_surface
description: >-
  Constant-size Ansible execution, bounded Docker subprocess work, deliberate
  final-report output, and benchmark-contract cases. Intentional table lines
  are not counted as incidental task noise.

batch_limits:
  catalogue_includes_container_ids_and_names: true
  scope_applied_before_container_inspect: true
  container_max_items: 100
  argument_byte_limit_binding: true
  default_argument_byte_limit_bytes: 8192
  argument_byte_limit_scope: complete_argv
  argument_terminating_nul_bytes: 1
  argument_encoding: os.fsencode
  default_container_id_bytes_including_nul: 65

state_and_deadline_limits:
  default_state_max_bytes: 16777216
  minimum_state_max_bytes: 1048576
  maximum_state_max_bytes: 268435456
  exact_canonical_serialization_is_binding: true
  default_discovery_timeout_seconds: 30
  minimum_discovery_timeout_seconds: 1
  maximum_discovery_timeout_seconds: 300
  one_monotonic_deadline_for_all_processes: true

normal_verbosity_event_budget:
  reference_invocation: static_import_role
  role_task_start_events: 1
  terminal_task_result_events: 1
  per_item_result_events: 0
  separate_include_success_events: 0
  callback_rendered_line_count_is_portability_invariant: false
  normal_verbosity_incidental_lines_definition: >-
    Role-emitted lines beyond the callback-owned task envelope and the
    intentional report or required diagnostic.

cases:
  - id: public_input_contract_is_frozen
    public_variables:
      docker_ansible_summary_enabled:
        presence: defaulted
        type: boolean
        default: true
      docker_ansible_summary_operation:
        presence: required
        type: string
        allowed_values: [pre, post, status]
      docker_ansible_summary_instance_id:
        presence: required
        type: string
        pattern: "[a-z0-9][a-z0-9_-]{0,62}"
      docker_ansible_summary_scope:
        presence: required
        type: ascii_fnmatch_scalar_or_list
        matcher: python_fnmatch_fnmatchcase
        max_normalized_patterns: 64
        max_pattern_ascii_bytes: 256
        max_normalized_ascii_bytes: 4096
      docker_ansible_summary_record_id:
        presence: optional
        type: string
        default: omitted
        pattern: "[A-Za-z0-9][A-Za-z0-9._:-]{0,127}"
      docker_ansible_summary_state_root:
        presence: defaulted
        type: posix_path
        default: /var/lib/docker-ansible-summary
        constraints: [absolute, non_root, exact_normal_form]
      docker_ansible_summary_journal_max_records:
        presence: defaulted
        type: integer
        default: 30
        minimum: 1
        maximum: 100
      docker_ansible_summary_state_max_bytes:
        presence: defaulted
        type: integer
        default: 16777216
        minimum: 1048576
        maximum: 268435456
      docker_ansible_summary_correlation_id:
        presence: optional
        type: string
        default: omitted
        maximum_utf8_bytes: 256
        control_characters_allowed: false
      docker_ansible_summary_report_mode:
        presence: defaulted
        type: string
        default: final
        allowed_values: [final, each, none]
      docker_ansible_summary_report_width:
        presence: defaulted
        type: integer
        default: 120
        minimum: 100
        maximum: 240
      docker_ansible_summary_discovery_timeout_seconds:
        presence: defaulted
        type: integer
        default: 30
        minimum: 1
        maximum: 300
      docker_ansible_summary_failure_policy:
        presence: defaulted
        type: string
        default: report
        allowed_values: [report, fail_after_report]
    internal_constants:
      container_chunk_max_items: 100
      complete_argv_max_bytes: 8192
      state_lock_timeout_seconds: 5
    oracle:
      exact_public_variable_count: 13
      strict_namespaced_allowlist: true
      unknown_namespaced_variable_rejected: true
      predecessor_namespace_variable_rejected: true
      registered_output_name_exempt: docker_ansible_summary_result
      defaults_are_documented_namespaced_defaults_only: true
      internal_constants_are_not_public_inputs: true

