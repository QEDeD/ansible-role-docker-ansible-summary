      ordinary:
        accepted_owner_uids: [0, 4242]
        group_or_other_writable: false
      root_owned_sticky:
        representative_path: /tmp
        uid: 0
        mode: "1777"
        accepted: true
    synthetic_namespace:
      traversal_from_root:
        - path: /srv
          type: directory
          uid: 0
          mode: "0755"
          symlink: false
          name_and_descriptor_identity_match: true
        - path: /srv/docker-ansible-summary
          type: directory
          uid: 4242
          mode: "0700"
          symlink: false
          name_and_descriptor_identity_match: true
