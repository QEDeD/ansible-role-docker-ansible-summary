        - path: /srv/docker-ansible-summary
          type: directory
          uid: 4242
          mode: "0700"
          symlink: false
          name_and_descriptor_identity_match: true
        - path: /srv/docker-ansible-summary/fixture-mdad
          type: directory
          uid: 4242
          mode: "0700"
          symlink: false
          name_and_descriptor_identity_match: true
        - path: /srv/docker-ansible-summary/fixture-mdad/state.json
          type: regular_file
          uid: 4242
          mode: "0600"
          link_count: 1
          symlink: false
          name_and_descriptor_identity_match: true
        - path: /srv/docker-ansible-summary/fixture-mdad/state.lock
          type: regular_file
          uid: 4242
          mode: "0600"
          link_count: 1
          symlink: false
          name_and_descriptor_identity_match: true
