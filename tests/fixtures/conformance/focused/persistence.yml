---
fixture_family: focused_cases
topic: persistence
description: >-
  Store-level cases supplementing the stale-writer transition in numbered
  scenario 21. Hashes and records are wholly synthetic.

cases:
  - id: state_root_lexical_contract
    accepted:
      - /var/lib/docker-ansible-summary
      - /srv/das-state
    rejected:
      - value: var/lib/docker-ansible-summary
        reason: not_absolute
      - value: /
        reason: filesystem_root_forbidden
      - value: /var/lib/../lib/docker-ansible-summary
        reason: parent_component
      - value: /var/lib/./docker-ansible-summary
        reason: current_component
      - value: /var//lib/docker-ansible-summary
        reason: repeated_separator
      - value: /var/lib/docker-ansible-summary/
        reason: trailing_separator
      - value: "/var/lib/docker-ansible-summary\0suffix"
        reason: nul
    oracle:
      persistence_outcome: not_attempted
      accepted_count: 2
      rejected_count: 7
      rejected_failure_reason: invalid_input
      filesystem_access_for_rejected: false
      docker_discovery_for_rejected: false

  - id: instance_id_namespace_grammar
    accepted:
      - mdad
      - mash-primary_2
      - recipe: lowercase_a_followed_by_62_lowercase_b
        utf8_bytes: 63
    rejected:
      - {value: "", reason: empty}
      - {value: MDAD, reason: uppercase}
      - {value: .mdad, reason: invalid_first_character}
      - {value: mdad.example, reason: dot}
      - {value: mdad/example, reason: separator}
      - {value: ../mdad, reason: traversal_syntax}
      - {value: "mdad instance", reason: whitespace}
      - recipe: lowercase_a_followed_by_63_lowercase_b
        utf8_bytes: 64
        reason: too_long
    oracle:
      persistence_outcome: not_attempted
      grammar: "[a-z0-9][a-z0-9_-]{0,62}"
      accepted_count: 3
      rejected_count: 8
      rejected_failure_reason: invalid_input
      filesystem_access_for_rejected: false
      docker_discovery_for_rejected: false

