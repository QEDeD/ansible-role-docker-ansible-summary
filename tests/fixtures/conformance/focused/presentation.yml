              image_content_changed: false
              image_content_evidence: image_id
            - container_name: fixture-cache
              primary_kind: unchanged
              kinds: [unchanged]
              before: *presentation_cache
              after: *presentation_cache
              image_reference_changed: false
              image_content_changed: false
              image_content_evidence: image_id
          warnings: []
        baseline:
          advanced: true
          before: obs-presentation-a
          after: obs-presentation-c
        baseline_advanced: true
        journal_status: complete
        persistence_outcome: committed
        replay_outcome: null
        simulated: false
        skipped: false
        warnings: []
    oracle:
      presentation_schema_version: 1
      primary_table_kind: run_window
      columns: [CONTAINER, BEFORE, AFTER, CHANGE]
      row_names: [fixture-api, fixture-cache]
      unchanged_rows_included: true
      table_blocks: 1
      between_observation_outcome: no_observed_difference
      between_observation_summary_omitted: true
      causal_attribution: false
      exact_report_model:
        presentation_schema_version: 1
        header:
          host: fixture-a.example.com
          instance_id: fixture-mdad
          operation: post
          observed_at: "2026-07-30T12:00:02Z"
          observation_status: complete
          correlation_id: null
          simulated: false
          replay_outcome: null
        primary_table:
          kind: run_window
          columns: [CONTAINER, BEFORE, AFTER, CHANGE]
          rows:
            - container_name: fixture-api
              machine_before: *presentation_api_before
              machine_after: *presentation_api_after
              cells:
                container: fixture-api
                before: "api:v1 / running"
                after: "api:v2 / running"
                change: "img+ref changed"
            - container_name: fixture-cache
              machine_before: *presentation_cache
