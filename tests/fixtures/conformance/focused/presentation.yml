        | CONTAINER                          | BEFORE                       | AFTER                        | CHANGE            |
        +------------------------------------+------------------------------+------------------------------+-------------------+
        | fixture-api                        | api:v1 / running             | api:v2 / running             | img+ref changed   |
        | fixture-cache                      | cache:v1 / running           | cache:v1 / running           | unchanged         |
        +------------------------------------+------------------------------+------------------------------+-------------------+
        Counts: image_changed=1, unchanged=1, total=2
        Baseline: advanced (obs-presentation-a -> obs-presentation-c)
        Journal: complete | Persistence: committed
        Warnings: none
      renderer_projection:
