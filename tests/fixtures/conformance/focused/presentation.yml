---
fixture_family: focused_cases
topic: presentation
description: >-
  Semantic human output, versioned report models, layout invariants, callback
  transport, and untruncated machine-output cases. Legacy table bytes are not
  contractual; the future v1 renderer will have exact golden snapshots.

cases:
  - id: lifecycle_messages_are_distinct
    input_variants:
      no_baseline:
        comparability: no_baseline
      no_observed_difference:
        comparability: exact
        changes: []
      incompatible_scope:
        comparability: incompatible_scope
      observation_partial:
        observation_status: partial
      observation_unavailable:
        observation_status: unavailable
        reason_code: docker_unavailable
      incomplete_run_pair:
        journal_status: incomplete_post
      persistence_conflict:
        persistence_outcome: conflict
    oracle:
      minimum_messages:
        no_baseline: ["No previous complete observation"]
        no_observed_difference: ["No observed run-window difference"]
        incompatible_scope: ["Scopes are incompatible", "No additions or removals inferred"]
        observation_partial: ["Observation partial"]
        observation_unavailable: ["Docker unavailable"]
        incomplete_run_pair: ["Run-window comparison unavailable"]
        persistence_conflict: ["Concurrent writer conflict", "Store unchanged"]
      causal_attribution_phrases_forbidden:
        - Ansible caused
        - deployment changed
        - task restarted

  - id: machine_values_are_never_presentation_truncated
    input:
      container_name: fixture-service-with-a-deliberately-long-but-valid-name-0123456789
      full_image_reference: registry.example.com:5443/fictional/team/component-with-a-long-name:release-2026-02-04
      image_id: "sha256:7777777777777777777777777777777777777777777777777777777777777777"
    presentation:
      configured_max_width: 32
      truncation_allowed: true
    oracle:
      machine_container_name: fixture-service-with-a-deliberately-long-but-valid-name-0123456789
      machine_full_image_reference: registry.example.com:5443/fictional/team/component-with-a-long-name:release-2026-02-04
      machine_image_id: "sha256:7777777777777777777777777777777777777777777777777777777777777777"
      machine_values_truncated: false
      human_report_readable: true

  - id: host_blocks_identify_independent_results
    input:
      hosts:
        - fixture-a.example.com
        - fixture-b.example.com
    oracle:
      one_host_identifiable_block_per_result: true
      atomic_multi_host_claim: false
      callback_interleaving_must_not_change_machine_results: true

  - id: warning_normalization_is_exact_bounded_and_sorted
    input:
      fixture_layer: internal_warning_normalizer_unit
      role_generated_templates_applied: false
      warning_sources:
        observation:
          - alpha warning
          - duplicate warning
          - zeta warning
        delta:
          - Beta warning
          - duplicate warning
        persistence:
          - alpha warning
      invalid_variants:
        non_printable:
          recipe: prefix_lf_suffix
        overlong_item:
          recipe: repeated_ascii
          character: x
          bytes: 257
        too_many_items:
          recipe: indexed_warnings
          count: 65
        total_serialized_bytes:
          recipe: indexed_fixed_width_warnings
          count: 33
          item_bytes: 250
    oracle:
      normalized_warnings:
        - Beta warning
        - alpha warning
        - duplicate warning
        - zeta warning
      exact_string_deduplication: true
      ordering: ascii_byte
      printable_ascii_only: true
      per_item_max_bytes: 256
      maximum_entries: 64
      maximum_serialized_utf8_bytes: 8192
      serialized_form: compact_json_utf8
      invalid_input_policy: reject_model
      silent_truncation_allowed: false
      invalid_variant_constraints:
        non_printable: printable_ascii
        overlong_item: per_item_bytes
        too_many_items: entry_count
        total_serialized_bytes: serialized_utf8_bytes

  - id: warning_generation_aggregates_metadata_gaps
    input:
      reason_code: required_field_missing
      metadata_gap_recipe:
        container_prefix: fixture-
        container_count: 4096
        field: full_image_reference
    oracle:
      exact_warnings:
        - "Required container evidence is missing; inspect metadata_gaps"
      exact_warning_count: 1
      exact_warning_item_bytes: 61
      exact_serialized_warning_bytes: 65
      exact_metadata_gap_count: 4096
      observed_identifiers_interpolated: false
      metadata_gaps_retain_exact_detail: true

